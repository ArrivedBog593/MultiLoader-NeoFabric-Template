# Every placeholder comes from gradle.properties, already escaped for a
# double-quoted string (see multiloader-loader.gradle): keep them inside "".
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="${mod_issues_url}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="${mod_homepage_url}"
# Since 26.2 the mod list shows an icon beside the name and a banner above
# the details (logoFile, now deprecated, was only the banner). The square
# icon serves as both; point bannerFile at a wide image for a real banner.
iconFile="assets/${mod_id}/icon.png"
bannerFile="assets/${mod_id}/icon.png"
# Pixel-art icon: keep it crisp when NeoForge scales it (the banner is never
# blurred). Remove for a painted icon.
iconBlur=false
credits="${mod_credits}"
authors="${mod_authors}"
description="${mod_description}"

[[mixins]]
config="${mod_id}.mixins.json"

[[mixins]]
config="${mod_id}.neoforge.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

