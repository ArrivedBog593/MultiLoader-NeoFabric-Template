// Plugin versions live here once; the modules apply them without one.
plugins {
    // Kept current: Loom refuses dependencies built with a newer Loom than
    // itself. Versions: https://maven.fabricmc.net/fabric-loom/fabric-loom.gradle.plugin/maven-metadata.xml
    id 'fabric-loom' version '1.16.3' apply false
    // Versions: https://projects.neoforged.net/neoforged/moddevgradle
    id 'net.neoforged.moddev' version '2.0.141' apply false
}
